# Historical Backtest Configuration

backtest:
  # Historical range
  start_date: "2026-08-15"
  end_date: "2026-09-15"
  eval_step_minutes: 5  # Step forward every closed 5m bar

  # Universe
  universe:
    mode: "configured"  # "configured" or "dynamic"
    symbols:
      - "BTCUSDT"
      - "ETHUSDT"
      - "SOLUSDT"

  # Execution simulation
  execution:
    entry_mode: "zone_touch"  # "zone_touch": price touches entry zone
    max_bars_to_enter: 12      # 12 * 5m = 60 minutes window to fill entry
    slippage:
      enabled: true
      bps: 2.0                 # 2 basis points (0.02%)
    ambiguous_candle: "conservative"  # "conservative": if both SL and TP hit in same bar, assume SL first

  # Fee model
  fees:
    model: "taker"             # Conservative default
    taker_rate: 0.00055        # 0.055% Bybit standard taker
    maker_rate: 0.00020        # 0.020% Bybit standard maker

  # Funding model
  funding:
    enabled: true
    default_rate_per_8h: 0.0001 # 0.01% standard baseline when historical funding missing

  # Risk & Position Model
  risk:
    risk_per_trade_pct: 1.0    # 1% risk per trade
    initial_capital: 10000.0   # $10,000 reference starting capital
    max_active_trades_per_symbol: 1
    max_total_active_trades: 5

  # Storage / Caching
  cache_dir: "data/historical"
