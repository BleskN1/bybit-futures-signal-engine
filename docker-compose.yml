services:
  bybit-signal-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bybit_signal_engine
    restart: always
    env_file:
      - .env
    volumes:
      - signal_engine_data:/app/data
      - ./config:/app/config:ro
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  signal_engine_data:
    driver: local
